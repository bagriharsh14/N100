# Screener Configuration and Threshold Definitions
presets:
  quality_compounder:
    name: "Quality Compounder"
    description: "High return on equity, low leverage, positive free cash flow, and steady revenue growth."
    filters:
      min_roe: 15.0
      max_de: 1.0
      min_fcf: 0.0
      min_revenue_cagr_5yr: 10.0
    ranking_metric: "composite_score"
    sort_ascending: false
    expected_count: [15, 35]

  value_pick:
    name: "Value Pick"
    description: "Attractive valuation multiples with moderate debt and steady dividend yield."
    filters:
      max_pe: 20.0
      max_pb: 3.0
      max_de: 2.0
      min_dividend_yield: 1.0
    ranking_metric: "fcf_yield_pct"
    sort_ascending: false
    expected_count: [10, 25]

  growth_accelerator:
    name: "Growth Accelerator"
    description: "High profit and revenue compounding over 5 years with controlled leverage."
    filters:
      min_pat_cagr_5yr: 20.0
      min_revenue_cagr_5yr: 15.0
      max_de: 2.0
    ranking_metric: "pat_cagr_5yr"
    sort_ascending: false
    expected_count: [8, 20]

  dividend_champion:
    name: "Dividend Champion"
    description: "High dividend yield supported by sustainable payout ratio and positive cash flow."
    filters:
      min_dividend_yield: 2.0
      max_dividend_payout: 80.0
      min_fcf: 0.0
    ranking_metric: "dividend_yield_pct"
    sort_ascending: false
    expected_count: [10, 20]

  debt_free_blue_chip:
    name: "Debt-Free Blue Chip"
    description: "Zero debt companies with healthy ROE and significant revenue scale (>5,000 Cr)."
    filters:
      max_de: 0.0
      min_roe: 12.0
      min_sales: 5000.0
    ranking_metric: "return_on_equity_pct"
    sort_ascending: false
    expected_count: [15, 30]

  turnaround_watch:
    name: "Turnaround Watch"
    description: "3-year revenue growth acceleration with improving positive cash flows."
    filters:
      min_revenue_cagr_3yr: 10.0
      min_fcf: 0.0
      deleveraging_only: true
    ranking_metric: "revenue_cagr_3yr"
    sort_ascending: false
    expected_count: [5, 15]

composite_score_weights:
  profitability:
    weight: 0.35
    metrics:
      return_on_equity_pct: 0.15
      roce_pct: 0.10
      net_profit_margin_pct: 0.10
  cash_quality:
    weight: 0.30
    metrics:
      fcf_cagr_5yr: 0.15
      cfo_pat_ratio: 0.10
      fcf_positive_flag: 0.05
  growth:
    weight: 0.20
    metrics:
      revenue_cagr_5yr: 0.10
      pat_cagr_5yr: 0.10
  leverage:
    weight: 0.15
    metrics:
      debt_to_equity_score: 0.10
      interest_coverage_score: 0.05
